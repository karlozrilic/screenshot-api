<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://karlozrilic.github.io/favicon/favicon.ico">
    <link rel="icon" href="https://karlozrilic.github.io/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" href="https://karlozrilic.github.io/favicon/favicon-512x512.png" type="image/png" sizes="512x512">
    <link rel="icon" href="https://karlozrilic.github.io/favicon/favicon-192x192.png" type="image/png" sizes="192x192">
    <link rel="icon" href="https://karlozrilic.github.io/favicon/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="https://karlozrilic.github.io/favicon/favicon-16x16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="https://karlozrilic.github.io/favicon/apple-touch-icon.png" type="image/png" sizes="180x180">
    <title>Screenshot API</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link href="./styles/style.css" rel="stylesheet" />
</head>
<body>
    <div class="app">
        <header>
            <div class="header-left">
                <span class="logo-dot"></span>
                <span class="logo-text">Screenshot API</span>
            </div>
            <button class="help-btn" onclick="openHelp()" aria-label="Open documentation">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.5 1C3.91 1 1 3.91 1 7.5S3.91 14 7.5 14 14 11.09 14 7.5 11.09 1 7.5 1zm.75 10.5h-1.5v-1.5h1.5v1.5zm1.55-5.44-.68.7C8.55 7.33 8.25 7.75 8.25 8.75h-1.5v-.375c0-.69.3-1.31.78-1.76l.94-.95c.24-.24.39-.57.39-.91 0-.69-.56-1.25-1.25-1.25S6.375 4.06 6.375 4.75H4.875C4.875 3.23 6.11 2 7.625 2S10.375 3.23 10.375 4.75c0 .62-.25 1.18-.675 1.56z" fill="currentColor"/>
                </svg>
                Docs
            </button>
        </header>

        <main>
            <div class="hero">
                <h1>Page <em>Preview</em></h1>
                <p class="subtitle">Capture full-page screenshots of any URL via the API</p>
            </div>

            <div class="capture-form">
                <div class="input-row">
                    <div class="input-wrapper">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 7C1 3.686 3.686 1 7 1s6 2.686 6 6-2.686 6-6 6S1 10.314 1 7z" stroke="currentColor" stroke-width="1.2"/>
                            <path d="M5 7c0-1.5.672-3 2-3.5M9 7c0 1.5-.672 3-2 3.5M1.5 5.5h11M1.5 8.5h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                        <input
                            id="url"
                            type="url"
                            placeholder="https://example.com"
                            onkeydown="if(event.key==='Enter') capture()"
                            autocomplete="off"
                            spellcheck="false"
                        />
                    </div>
                    <button class="capture-btn" onclick="capture()" id="capture-btn">
                        <span class="btn-text">Capture</span>
                        <svg class="btn-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div id="status" class="status" style="display:none">
                <div class="status-inner">
                    <div class="spinner"></div>
                    <span>Capturing screenshot…</span>
                </div>
            </div>

            <div id="result"></div>
        </main>
    </div>

    <!-- Help Modal -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeHelp()" style="display:none">
        <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <span id="modal-title" class="modal-title">Documentation</span>
                    <a class="modal-github" href="https://github.com/karlozrilic/screenshot-api" target="_blank" rel="noopener" aria-label="View on GitHub">
                        <object
                            type="image/svg+xml"
                            data="https://cdn.simpleicons.org/github/black/white"
                            width="15"
                            height="15">
                        </object>
                        GitHub
                    </a>
                </div>
                <button class="modal-close" onclick="closeHelp()" aria-label="Close">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <div class="modal-loading">
                    <div class="spinner"></div>
                    <span>Loading docs…</span>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/index.js" type="module"></script>
</body>
</html>
